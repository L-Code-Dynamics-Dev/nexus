<aside><h1>NEXUS</h1><p>Správa pravidel všech enginů<br><span id="inventory-count"></span></p><nav id="nav"></nav></aside><main><div class="top"><span class="muted">Pracovní prostor / Nastavení enginů</span><select id="shop" style="width:240px"><option value="shop-cz">Ukázkový obchod · CZ</option><option value="shop-sk">Ukázkový obchod · SK</option></select></div><div class="notice">Návrh administrační aplikace. Datové sady pocházejí z repozitářů; úpravy se ukládají jako místní návrh v paměti této stránky. Produkční backendy nejsou připojené. Hodnoty označené „V kódu“ vyžadují rozšíření backendu.</div><div id="app"></div></main>
<dialog id="modal"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="toolbar"><button onclick="document.querySelector('#modal').close()">Zavřít</button></div></dialog><input type="file" id="file" accept="application/json,.json"><div id="toast" role="status"></div>

<script>
const catalog=JSON.parse(document.querySelector('#catalog').textContent);const clone=x=>JSON.parse(JSON.stringify(x));const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={version:'Verze',description:'Popis',loyaltyTiers:'Věrnostní úrovně',brandLimits:'Stropy slev podle značky',categoryLimits:'Stropy slev podle kategorie',brandSaleDiscounts:'Celoroční akční slevy značek',mode:'Režim kupónů',defaultMaxDiscount:'Výchozí strop slevy (%)',lockedTiers:'Úrovně bez kupónů',disabledBrands:'Značky bez kupónů',disabledProducts:'Produkty bez kupónů',minTurnover:'Obrat od',maxTurnover:'Obrat do',discount:'Sleva',customerGroup:'Zákaznická skupina',priceListId:'ID ceníku',groupId:'ID skupiny',reviewThreshold:'Práh ruční kontroly',restrictThreshold:'Práh omezení',codPolicyAction:'Akce pro dobírku',fallbackBehavior:'Chování při výpadku',networkEnabled:'Sdílené reputační signály',signalRetentionDays:'Uchování signálů (dny)',doseMatrix:'Celá matice dávek',compositionProfile:'Poměry složek dávky',conflictResolution:'Řešení překryvů pravidel',safety:'Bezpečnostní pravidla',conditions:'Diagnózy a stavy',conditionRules:'Pravidla podle diagnóz',priority:'Priorita',pctMin:'Minimum (% hmotnosti)',pctMax:'Maximum (% hmotnosti)',portions:'Počet porcí',lifeStage:'Životní fáze',activity:'Úroveň aktivity',baseWeight:'Základ výpočtu hmotnosti',neutered:'Kastrovaný pes',labelCs:'Název pro zákazníka',nameCs:'Český název',conditionId:'Podmínka / diagnóza',ruleType:'Druh pravidla',target:'Cíl',op:'Operátor',value:'Hodnota',unit:'Jednotka',noteCs:'Vysvětlení',source:'Zdroj metodiky',sourceVersion:'Verze zdroje',ruleSetId:'Verze sady pravidel',ingredients:'Suroviny',speciesGroups:'Skupiny druhů',targets:'Nutriční cíle',caPRatio:'Poměr vápníku a fosforu',isToxic:'Toxická surovina',commonAllergen:'Běžný alergen',blocksResult:'Blokuje doporučení',requiresVet:'Vyžaduje veterináře',severity:'Závažnost',categoryMap:'Mapování kategorií (pořadí rozhoduje)',match:'Shoda podle výrazu',barfGroup:'BARF skupina',groupNameRules:'Povolené a zakázané názvy',requireAny:'Musí obsahovat některé slovo',forbidAny:'Nesmí obsahovat žádné slovo',activityOptions:'Aktivity nabízené zákazníkům',packagingOptions:'Obaly pro doručení',defaultPeriodDays:'Výchozí období (dny)',allowedPeriodDays:'Povolená období (dny)',recipe:'Recept a PDF',ruleSetIds:'Používané sady pravidel',catalog:'Zdroj katalogu',supplements:'Doplňky stravy',products:'Produktová pravidla a složení',enabled:'Pravidlo zapnuté',exceptions:'Výjimky',parameters:'Parametry',clauses:'Podmínky použití',action:'Akce',attribute:'Vstupní vlastnost',operator:'Operátor',currency:'Měna',average_order_value:'Průměrná hodnota objednávky',product_margin_rate:'Marže (0–1)',shipping_cost_outbound:'Doprava k zákazníkovi',shipping_cost_return:'Zpětná doprava',restock_packaging_cost:'Opětovné naskladnění a obal',payment_processing_rate:'Poplatek platební brány (0–1)',cod_handling_fee:'Poplatek dobírky',customer_friction_cost:'Náklad ztráty zákazníka'};
const enums={mode:['fixed-amount','percent-ceiling'],codPolicyAction:['RESTRICT_COD','REQUIRE_PREPAYMENT','FLAG_ONLY'],fallbackBehavior:['ALLOW','REVIEW','RESTRICT'],lifeStage:['PUPPY_0_6','PUPPY_6_12','JUNIOR','ADULT','SENIOR'],activity:['LOW','MEDIUM','HIGH','WORKING'],baseWeight:['ACTUAL','IDEAL'],barfGroup:['MUSCLE','BONE','LIVER','ORGAN','PLANT','SUPPLEMENT','OTHER'],operator:['EQ','NEQ','GT','GTE','LT','LTE','IN','NOT_IN','CONTAINS']};const states={data:'Datová sada',api:'Existující API',code:'V kódu · návrh změny',contract:'Návrh kontraktu'};
let engine=catalog.engines[0],selected=engine.documents[0]?.id,tab='config',mode='form',filter='',scope='all',timer;const working=new Map(),saved=new Map(),ruleDrafts=new Map(),history=[];
const shop=()=>document.querySelector('#shop').value;const key=id=>shop()+'::'+id;const doc=()=>engine.documents.find(d=>d.id===selected);function value(){const d=doc();if(!working.has(key(d.id)))working.set(key(d.id),clone(d.value));return working.get(key(d.id));}
function badge(s){return `<span class="badge ${s}">${states[s]}</span>`}const pathname=p=>encodeURIComponent(JSON.stringify(p)).replace(/'/g,'%27');const parsePath=s=>JSON.parse(decodeURIComponent(s));function getAt(obj,p){return p.reduce((o,k)=>o[k],obj)}function setAt(obj,p,v){if(!p.length)return v;getAt(obj,p.slice(0,-1))[p.at(-1)]=v;return obj;}function set(p,v){working.set(key(doc().id),setAt(value(),p,v));document.querySelector('#validation').innerHTML='';}
function setRule(p,v){const k=key('rule:'+selected),obj=ruleValue();ruleDrafts.set(k,setAt(obj,p,v));}function ruleValue(){const k=key('rule:'+selected);if(!ruleDrafts.has(k))ruleDrafts.set(k,{enabled:true,priority:null,clauses:[],exceptions:[],parameters:{}});return ruleDrafts.get(k);}
function field(path,val,rule=false){const k=path.at(-1)||'value',label=labels[k]||k,p=pathname(path),fn=rule?'setRule':'set';let control;if(typeof val==='boolean')control=`<input aria-label="${esc(label)}" type="checkbox" ${val?'checked':''} onchange="${fn}(parsePath('${p}'),this.checked)">`;else if(typeof val==='number')control=`<input aria-label="${esc(label)}" type="number" step="any" value="${val}" onchange="if(this.value!==''&&Number.isFinite(Number(this.value)))${fn}(parsePath('${p}'),Number(this.value));else toast('Vyplňte platné číslo.')">`;else if(val===null)control=`<div class="row"><input aria-label="${esc(label)}" placeholder="Nenastaveno · null" onchange="${fn}(parsePath('${p}'),this.value===''?null:(Number.isFinite(Number(this.value))?Number(this.value):this.value))"><small>null</small></div>`;else if(enums[k])control=`<select aria-label="${esc(label)}" onchange="${fn}(parsePath('${p}'),this.value)">${[...new Set([val,...enums[k]])].map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')}</select>`;else if(String(val).length>100)control=`<textarea aria-label="${esc(label)}" onchange="${fn}(parsePath('${p}'),this.value)">${esc(val)}</textarea>`;else control=`<input aria-label="${esc(label)}" value="${esc(val)}" onchange="${fn}(parsePath('${p}'),this.value)">`;return `<div class="field"><label>${esc(label)}<small>${esc(path.join(' › '))}${path.some(x=>['loyaltyTiers','brandLimits','categoryLimits','brandSaleDiscounts'].includes(x))?' · podíl 0–1; 0,15 = 15 %':''}</small>${path.length?`<button class="small" title="Odstranit pole z návrhu" onclick="removeProperty('${p}',${rule})">Odstranit pole</button>`:''}</label><div>${control}</div></div>`;}
function tree(obj,path=[],rule=false){if(obj===null||typeof obj!=='object')return field(path,obj,rule);if(Array.isArray(obj)){const p=pathname(path);return `<div>${obj.length?obj.map((x,i)=>{const title=typeof x==='object'&&x!==null?(x.labelCs||x.nameCs||x.id||x.conditionId||x.productId||'Položka '+(i+1)):String(x);return `<details data-path="${pathname([...path,i])}" class="nest item" ontoggle="expand(this,'${pathname([...path,i])}',${rule})"><summary><span>${i+1}. ${esc(String(title).slice(0,110))}</span><span class="muted">Upravit</span></summary><div class="body"></div><div class="arr-actions"><button class="small" onclick="moveItem('${p}',${i},-1,${rule})" ${i===0?'disabled':''}>↑</button><button class="small" onclick="moveItem('${p}',${i},1,${rule})" ${i===obj.length-1?'disabled':''}>↓</button><button class="small" onclick="copyItem('${p}',${i},${rule})">Duplikovat</button><button class="small" onclick="removeItem('${p}',${i},${rule})">Odstranit</button></div></details>`}).join(''):'<p class="muted">Žádné položky.</p>'}<button class="small" onclick="addItem('${p}',${rule})">+ Přidat položku</button></div>`;}return Object.entries(obj).map(([k,v])=>v!==null&&typeof v==='object'?`<details data-path="${pathname([...path,k])}" class="nest" ontoggle="expand(this,'${pathname([...path,k])}',${rule})"><summary><span>${esc(labels[k]||k)}</span><span class="muted">${Array.isArray(v)?v.length+' položek':Object.keys(v).length+' polí'}</span></summary><div class="body"></div></details>`:field([...path,k],v,rule)).join('')+`<button class="small" onclick="addProperty('${pathname(path)}',${rule})">+ Přidat pole / výjimku</button>`;}
function expand(el,p,rule){if(el.open&&!el.querySelector(':scope > .body').dataset.loaded){const body=el.querySelector(':scope > .body');body.dataset.loaded='1';body.innerHTML=tree(getAt(rule?ruleValue():value(),parsePath(p)),parsePath(p),rule)}}
function redraw(){const paths=[...document.querySelectorAll('#editor details[open][data-path]')].map(e=>e.dataset.path);tab==='rules'?renderRules():renderEditor();for(const p of paths){const el=[...document.querySelectorAll('#editor details[data-path]')].find(e=>e.dataset.path===p);if(el){el.open=true;expand(el,p,tab==='rules')}}}function openBranch(path,rule){for(let i=1;i<=path.length;i++){const p=pathname(path.slice(0,i));const el=[...document.querySelectorAll('#editor details[data-path]')].find(e=>e.dataset.path===p);if(el){el.open=true;expand(el,p,rule);if(i===path.length)el.scrollIntoView({block:'nearest'})}}}function arrayAt(p,rule){return getAt(rule?ruleValue():value(),parsePath(p))}function moveItem(p,i,dir,rule){const a=arrayAt(p,rule),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];redraw()}function removeProperty(p,rule){const path=parsePath(p);if(!path.length)return;const obj=getAt(rule?ruleValue():value(),path.slice(0,-1));delete obj[path.at(-1)];redraw()}function removeItem(p,i,rule){arrayAt(p,rule).splice(i,1);redraw()}function copyItem(p,i,rule){const a=arrayAt(p,rule),v=clone(a[i]);if(v&&typeof v==='object'&&!Array.isArray(v)&&typeof v.id==='string')v.id+='-copy-'+(a.length+1);a.splice(i+1,0,v);redraw()}function addItem(p,rule){const a=arrayAt(p,rule),v=a.length?clone(a.at(-1)):(rule?{attribute:'',operator:'EQ',value:null}:'');if(v&&typeof v==='object'&&!Array.isArray(v)&&typeof v.id==='string')v.id+='-new-'+(a.length+1);a.push(v);redraw();openBranch([...parsePath(p),a.length-1],rule);toast('Nová položka přidána do návrhu. Upravte její hodnoty ve formuláři.')}function addProperty(p,rule){openModal('Přidat pole / pravidlo',`<label>Název pole / značky / kategorie</label><input id="new-key" placeholder="Například nová značka nebo parametr"><label>Typ hodnoty</label><select id="new-type"><option value="number">Číslo</option><option value="string">Text</option><option value="boolean">Ano / ne (true / false)</option><option value="json">Seznam nebo složená hodnota (JSON)</option><option value="null">Nenastaveno</option></select><label>Hodnota</label><input id="new-value" value="0"><button class="primary" id="confirm-add">Přidat pole</button>`);document.querySelector('#confirm-add').onclick=()=>{try{const name=document.querySelector('#new-key').value.trim();if(!name||['__proto__','constructor','prototype'].includes(name))throw Error('Nevhodný název pole');const obj=getAt(rule?ruleValue():value(),parsePath(p));if(Object.hasOwn(obj,name))throw Error('Pole už existuje');const raw=document.querySelector('#new-value').value,type=document.querySelector('#new-type').value;let val;if(type==='number'){val=Number(raw);if(!raw.trim()||!Number.isFinite(val))throw Error('Vyplňte platné číslo.')}else if(type==='string')val=raw;else if(type==='boolean'){if(!['true','false'].includes(raw))throw Error('Vyplňte true nebo false.');val=raw==='true'}else if(type==='null')val=null;else{val=JSON.parse(raw);safeKeys(val)}obj[name]=val;document.querySelector('#modal').close();redraw();openBranch(parsePath(p),rule)}catch(e){toast(e.message)}}}
function renderNav(){document.querySelector('#nav').innerHTML=catalog.engines.map(e=>`<button class="${e.id===engine.id?'active':''}" onclick="chooseEngine('${e.id}')">${esc(e.label)}</button>`).join('');document.querySelector('#inventory-count').textContent=catalog.engines.length+' sekcí · '+catalog.engines.reduce((a,e)=>a+e.rules.length,0)+' modulů pravidel'}function chooseEngine(id){engine=catalog.engines.find(e=>e.id===id);selected=engine.documents[0]?.id;tab=engine.documents.length?'config':'rules';filter='';mode='form';render()}function changeTab(t){tab=t;filter='';selected=t==='config'?engine.documents[0]?.id:engine.rules[0]?.source;render()}function render(){renderNav();document.querySelector('#app').innerHTML=`<h1>${esc(engine.label)}</h1><p class="muted help">${esc(engine.description)}</p><div class="stats"><div class="card"><div class="muted">Sady nastavení</div><div class="big">${engine.documents.length}</div></div><div class="card"><div class="muted">Moduly pravidel</div><div class="big">${engine.rules.length}</div></div><div class="card"><div class="muted">Režim změn</div><h3>Návrh → validace → rozdíl → verze</h3></div></div><div class="toolbar tabs"><button class="${tab==='config'?'active':''}" onclick="changeTab('config')">Všechna nastavení</button><button class="${tab==='rules'?'active':''}" onclick="changeTab('rules')">Podmínky, priority a výjimky</button><button onclick="showHistory()">Serverová historie (${history.length})</button><button onclick="exportEngine()">Export enginu</button></div><div class="layout"><div><input id="search" aria-label="Hledat sadu nebo pravidlo" placeholder="Hledat sadu nebo pravidlo…" oninput="filter=this.value;renderList()"><div class="toolbar"><select aria-label="Druh konfigurace" onchange="scope=this.value;renderList()"><option value="all" ${scope==='all'?'selected':''}>Všechny zdroje</option><option value="data" ${scope==='data'?'selected':''}>Datové sady / API</option><option value="code" ${scope==='code'?'selected':''}>Hodnoty v kódu</option></select></div><div id="list" class="list"></div></div><div id="editor" class="card"></div></div><div id="history-panel"></div>`;if(tab==='rules'&&!engine.rules.some(r=>r.source===selected))selected=engine.rules[0]?.source;renderList();tab==='config'?renderEditor():renderRules()}
function renderList(){const items=tab==='config'?engine.documents:engine.rules;document.querySelector('#list').innerHTML=items.filter(d=>!filter||(d.label||d.name).toLowerCase().includes(filter.toLowerCase())||d.source.toLowerCase().includes(filter.toLowerCase())).filter(d=>tab==='rules'||scope==='all'||(scope==='data'?['data','api'].includes(d.status):['code','contract'].includes(d.status))).map(d=>`<button class="${selected===(d.id||d.source)?'active':''}" onclick="selectItem('${d.id||d.source}')">${esc(d.label||d.name)}<small>${tab==='config'?states[d.status]:'Pravidlo · návrh konfigurace'}</small></button>`).join('')||'<div class="empty">Žádná odpovídající položka.</div>'}function selectItem(id){selected=id;mode='form';renderList();redraw()}
function renderEditor(){const d=doc();const el=document.querySelector('#editor');if(!d){el.innerHTML='<h2>Nastavení v datové podobě zatím chybí</h2><p class="help">Přejděte na podmínky a pravidla. Zde navrhnete konfigurační kontrakt pro existující logiku.</p>';return;}el.innerHTML=`<div class="row"><h2>${esc(d.label)}</h2>${badge(d.status)}</div><div class="source">${esc(d.source)}</div><div class="brandline help">${d.status==='code'?'Tyto hodnoty jsou dnes v kódu. Tady připravujete jejich konfigurační návrh; engine je začne načítat až po úpravě backendu.':d.status==='contract'?'Návrh vstupního kontraktu. Nevyplněné hodnoty zůstávají null; skutečné nastavení musí načíst backend obchodu.':'Celý obsah datové sady. Vnořené sekce obsahují všechny řádky a parametry, včetně podmínek, zdrojů a výjimek.'}</div><div class="toolbar"><button onclick="mode='form';renderEditor()">Formulář všech polí</button><button onclick="mode='json';renderEditor()">Úplný JSON</button><button onclick="document.querySelector('#file').click()">Import JSON</button><button onclick="download(doc().label+'.json',value())">Export JSON</button></div><div id="fields">${mode==='json'?`<textarea class="raw" id="raw" aria-label="Úplný JSON">${esc(JSON.stringify(value(),null,2))}</textarea><button onclick="applyRaw()">Použít JSON do návrhu</button>`:tree(value())}</div><div id="validation"></div><div class="bottom"><button onclick="validateOnServer()">Ověřit návrh</button><button onclick="previewDiff()">Zobrazit změny</button><button class="primary" onclick="saveVersion()">Uložit verzi na server</button><button onclick="resetDoc()">Vrátit načtené hodnoty</button></div>`}
function applyRaw(){try{const parsed=JSON.parse(document.querySelector('#raw').value);safeKeys(parsed);if(parsed===null||typeof parsed!=='object')throw Error('Kořen konfigurace musí být objekt nebo pole');working.set(key(doc().id),parsed);toast('JSON použit do návrhu.');return true}catch(e){toast(e.message);return false}}
function validate(d,v){const errors=[];function recur(x,p){if(typeof x==='number'&&!Number.isFinite(x))errors.push(p+': neplatné číslo');if(Array.isArray(x)){const ids=x.filter(t=>t&&typeof t==='object'&&typeof t.id==='string').map(t=>t.id);if(new Set(ids).size!==ids.length)errors.push(p+': duplicitní id pravidla');x.forEach((t,i)=>recur(t,p+'['+i+']'));}else if(x&&typeof x==='object'){if(typeof x.pctMin==='number'&&typeof x.pctMax==='number'&&x.pctMin>x.pctMax)errors.push(p+': minimum musí být ≤ maximum');if(x.portions!==undefined&&(!Number.isInteger(x.portions)||x.portions<1))errors.push(p+': počet porcí musí být kladné celé číslo');if(x.allowedPeriodDays&&x.defaultPeriodDays&&!x.allowedPeriodDays.includes(x.defaultPeriodDays))errors.push(p+': výchozí období není mezi povolenými');for(const [k,t]of Object.entries(x))recur(t,p+'.'+k)}}recur(v,'config');if(d.source.includes('policy-v1.json')){for(const k of ['loyaltyTiers','brandLimits','categoryLimits','brandSaleDiscounts'])if(v[k])for(const [name,n]of Object.entries(v[k]))if(typeof n!=='number'||n<0||n>1)errors.push(k+'.'+name+': sleva musí být číslo v rozsahu 0–1');if(!v.loyaltyTiers||typeof v.loyaltyTiers!=='object'||Array.isArray(v.loyaltyTiers))errors.push('Chybí mapa loyaltyTiers');}if(d.source.includes('coupon-policy.json')){if(!['fixed-amount','percent-ceiling'].includes(v.mode))errors.push('Neplatný režim kupónů');if(typeof v.defaultMaxDiscount!=='number'||v.defaultMaxDiscount<0||v.defaultMaxDiscount>100)errors.push('Strop kupónu musí být v rozsahu 0–100 %');}if(d.status==='api'&&engine.id==='safeorder'){if(typeof v.reviewThreshold!=='number'||v.reviewThreshold<.1||v.reviewThreshold>5)errors.push('Práh kontroly: 0,1–5');if(typeof v.restrictThreshold!=='number'||v.restrictThreshold<.2||v.restrictThreshold>10)errors.push('Práh omezení: 0,2–10');if(v.reviewThreshold>=v.restrictThreshold)errors.push('Práh kontroly musí být nižší než práh omezení');if(v.signalRetentionDays<30||v.signalRetentionDays>365)errors.push('Retence signálů: 30–365 dní');if(!enums.codPolicyAction.includes(v.codPolicyAction))errors.push('Neplatná akce pro dobírku');if(!enums.fallbackBehavior.includes(v.fallbackBehavior))errors.push('Neplatné chování při výpadku');if(typeof v.networkEnabled!=='boolean')errors.push('Síťové signály musí být boolean');}return errors;}
function validateCurrent(){if(mode==='json'&&!applyRaw())return false;const errors=validate(doc(),value());document.querySelector('#validation').innerHTML=errors.length?`<div class="error">${errors.map(esc).join('<br>')}</div>`:'<div class="valid">Základní kontroly návrhu prošly. Backendová validace a skutečná simulace ještě nejsou připojené.</div>';return !errors.length;}
function diff(a,b,p=''){if(JSON.stringify(a)===JSON.stringify(b))return [];if(a&&b&&typeof a==='object'&&typeof b==='object'){return [...new Set([...Object.keys(a),...Object.keys(b)])].flatMap(k=>diff(a[k],b[k],p?(p+'.'+k):k));}return [{path:p,before:a===undefined?'(chybí)':a,after:b===undefined?'(odstraněno)':b}];}function previewDiff(){if(mode==='json'&&!applyRaw())return;const changes=diff(saved.get(key(doc().id))?.value||doc().value,value());openModal('Rozdíl oproti poslední místní verzi',changes.length?`<table><tr><th>Pole</th><th>Před</th><th>Po</th></tr>${changes.map(c=>`<tr><td>${esc(c.path)}</td><td>${esc(JSON.stringify(c.before))}</td><td>${esc(JSON.stringify(c.after))}</td></tr>`).join('')}</table><p class="help">Toto je rozdíl konfigurace. Dopad na ceny, objednávky nebo dávky musí spočítat příslušný engine.</p>`:'Žádné změny.');}
function saveVersion(){if(!validateCurrent())return;const id=key(doc().id),before=saved.get(id)?.value||doc().value,changes=diff(before,value());if(!changes.length){toast('Žádné změny k uložení.');return;}const n=(saved.get(id)?.revision||0)+1;saved.set(id,{revision:n,value:clone(value())});history.unshift({shop:shop(),engine:engine.label,document:doc().label,time:new Date().toLocaleString('cs-CZ'),revision:n,changes,value:clone(value()),id});toast('Místní verze '+n+' uložena; do enginu se neposílá.');}
function resetDoc(){working.set(key(doc().id),clone(doc().value));renderEditor();toast('Načtené hodnoty obnoveny do návrhu.')}
function renderRules(){const r=engine.rules.find(r=>r.source===selected);if(!r){document.querySelector('#editor').innerHTML='<p>Vyberte modul pravidla.</p>';return;}document.querySelector('#editor').innerHTML=`<div class="row"><h2>${esc(r.name)}</h2>${badge('contract')}</div><div class="source">${esc(r.source)}</div><p class="help">${esc(r.summary||'Existující modul enginu.')}</p><div class="brandline help">Návrh nastavení tohoto konkrétního modulu: aktivace, priorita, podmínky, výjimky a parametry. Uvedený konfigurační obal je nový; současný backend jej zatím nečte.</div><div class="rule-form">${tree(ruleValue(),[],true)}</div><div class="toolbar"><button onclick="addRuleClause('clauses')">+ Přidat podmínku</button><button onclick="addRuleClause('exceptions')">+ Přidat výjimku</button><button class="primary" onclick="saveRuleVersion()">Uložit návrh pravidla</button><button onclick="download('${esc(r.name)}-navrh.json',{module:r.source,status:'proposed',configuration:ruleValue()})">Export návrhu pravidla</button></div><details class="nest"><summary>Existující vstupní kontrakty (${r.contracts.length})</summary><p class="help">Přehled skutečných vstupů modulu. Některé jsou data produktu či objednávky, další patří do konfigurace.</p>${r.contracts.map(c=>`<h3>${esc(c.name)}</h3><table><tr><th>Vstup</th><th>Typ / přípustné hodnoty</th></tr>${c.fields.map(f=>`<tr><td>${esc(f.name)}${f.optional?' (volitelný)':''}</td><td>${esc(f.type)}</td></tr>`).join('')}</table>`).join('')}</details><details class="nest"><summary>Hodnoty nalezené v kódu (${r.constants.length})</summary>${r.constants.map(c=>`<h3>${esc(c.key)} · řádek ${c.line}</h3><pre>${esc(JSON.stringify(c.value,null,2))}</pre>`).join('')}</details>`}
function addRuleClause(kind){ruleValue()[kind].push({attribute:'',operator:'EQ',value:null});renderRules();const nodes=document.querySelectorAll('#editor details');for(const node of nodes)if(node.querySelector('summary')?.textContent.includes(labels[kind]))node.open=true;}
function saveRuleVersion(){const r=engine.rules.find(r=>r.source===selected),v=ruleValue();if(v.priority!==null&&!Number.isInteger(v.priority)){toast('Priorita musí být celé číslo nebo null.');return;}for(const group of ['clauses','exceptions'])for(const c of v[group])if(!c.attribute?.trim()||!enums.operator.includes(c.operator)){toast('Doplňte vlastnost a platný operátor každé podmínky i výjimky.');return;}const id=key('rule:'+selected),before=saved.get(id)?.value||{enabled:true,priority:null,clauses:[],exceptions:[],parameters:{}},changes=diff(before,v);if(!changes.length){toast('Žádné změny k uložení.');return;}const n=(saved.get(id)?.revision||0)+1;saved.set(id,{revision:n,value:clone(v)});history.unshift({type:'rule',shop:shop(),engine:engine.label,document:r.name,time:new Date().toLocaleString('cs-CZ'),revision:n,changes,value:clone(v),id});toast('Místní návrh pravidla uložen. Backendový konfigurační obal je třeba implementovat.');}
function showHistory(){openModal('Místní historie verzí',history.length?`<table><tr><th>Čas</th><th>Obchod / sada</th><th>Verze</th><th>Změny</th></tr>${history.map((h,i)=>`<tr><td>${esc(h.time)}</td><td>${esc(h.shop)}<br>${esc(h.document)}</td><td>${h.revision}</td><td>${h.changes.length} polí <button class="small" onclick="restore(${i})">Načíst do návrhu</button></td></tr>`).join('')}</table>`:'Zatím nejsou uložené žádné místní verze.')}
function restore(i){const h=history[i];if(h.type==='rule')ruleDrafts.set(h.id,clone(h.value));else working.set(h.id,clone(h.value));document.querySelector('#modal').close();toast('Historická verze načtena do návrhu pro '+h.shop+'.');if(h.id===key(selected)||h.id===key('rule:'+selected))redraw()}
function exportEngine(){download(engine.id+'-navrh.json',{engine:engine.id,shop:shop(),status:'prototype-draft',documents:engine.documents.map(d=>({source:d.source,status:d.status,configuration:clone(working.get(key(d.id))||d.value)})),ruleConfigurations:engine.rules.map(r=>({module:r.source,status:'proposed',configuration:ruleDrafts.get(key('rule:'+r.source))||null}))});}
function download(name,v){const blob=new Blob([JSON.stringify(v,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace(/[^a-zA-Z0-9._-]/g,'-');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function openModal(title,html){document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-body').innerHTML=html;document.querySelector('#modal').showModal()}function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.style.display='block';clearTimeout(timer);timer=setTimeout(()=>el.style.display='none',4000)}
function safeKeys(x){if(x&&typeof x==='object')for(const [k,v]of Object.entries(x)){if(['__proto__','constructor','prototype'].includes(k))throw Error('Zakázaný klíč v importu');safeKeys(v)}}
document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());safeKeys(data);if(data===null||typeof data!=='object')throw Error('Konfigurace musí být objekt nebo pole');working.set(key(doc().id),data);renderEditor();toast('JSON načten do návrhu; před uložením ověřte hodnoty.')}catch(err){toast('Import selhal: '+err.message)}e.target.value=''};
document.querySelector('#shop').onchange=()=>{render();toast('Nastavení přepnuto pro vybraný obchod.')};render();
</script><script>__BACKEND_SCRIPT__</script></html>
